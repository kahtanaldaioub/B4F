<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
</head>
<body>
    <h1>contact form</h1>
    <form action="#">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br>
        <label for="phone">phone:</label>
        <input type="number" id="phone" name="phone">
        <br>
        <label for="subject">subject</label>
        <select name="subjects" id="subjects">
            <option value="report">report error</option>
            <option value="chat">chat with me</option>
            <option value="work">work with me</option>
        </select>
        <br>
        <label for="message">message:</label>
        <br>
        <textarea name="message" id="message">message me here</textarea>
        <br>
        <label for="newsletter">news letter</label>
        <input type="checkbox" name="newsletter" id="newsletter">
        <br>
       <button type="submit">Submit</button>
    </form>
</body>
</html>
