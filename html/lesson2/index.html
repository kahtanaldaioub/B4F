<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables + Semantic + Audio + Video  </title>
</head>
<body>
    <table>
    <caption>Student Grades</caption>
    
    <thead>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Grade</th>
        </tr>
    </thead>
    
    <tbody>
        <tr>
            <td>John</td>
            <td>Math</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>Math</td>
            <td>B</td>
        </tr>
        
    </tbody>
    
    <tfoot>
        <tr>
            <td colspan="3">Class Average: A-</td>
        </tr>
    </tfoot>
</table>

    <!-- HTML5 Semantic Elements:
     Benefits of Semantic HTML:

        Better for SEO
        Improved accessibility
        Easier to read and maintain
        Better browser support
        -->

    <header>
    <nav>
        <ul>
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>About Section</h2>

        <details>
            <summary>Click to see more</summary>
            <p>This content is hidden by default and shown when clicked.</p>
        </details>

        <article>
            <h3>Article Title</h3>
            <p>Article content...</p>
        </article>
    </section>
    
    <aside>
        <h3>Sidebar</h3>
        <p>Sidebar content...</p>
    </aside>
</main>

<footer>
    <p>&copy; 2024 My Website</p>
</footer>

<!-- Audio  -->
 <audio  muted>
    <source src="" type="">
    <source src="" type="">
    Your browser does not support audio.
 </audio>
 <audio src=""></audio>

 <!-- Video Element -->
  <video width="" height="" controls preload="">
    <track></track>
    <source src="" type="">
    <source src="" type="">
    Your browser does not support video.
  </video>

</body>
</html>
