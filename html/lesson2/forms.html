<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <form action="" method="">
        <label for="name">name</label>
        <input type="text" name="name" id="name" placeholder="name">
        <input type="password" name="password" id="password" placeholder="password">
        <input type="number" name="number" id="number" placeholder="number">
        <input type="email" name="email" id="email" placeholder="email">
        <input type="date" name="date" id="date" placeholder="date">
        <input type="color" name="color" id="color" placeholder="color">
        <input type="range" name="range" id="range" placeholder="range" min="0" max="10">
        
        <input type="checkbox" name="checkbox" id="checkbox" placeholder="checkbox" >
        <label for="checkbox">checkbox</label>
        <input type="radio" name="radio" id="radio" placeholder="radio"  >
        <input type="radio" name="radio" id="radio" placeholder="radio"  checked>
        <input type="radio" name="radio" id="radio" placeholder="radio" >
        <input type="file" name="file" id="file" placeholder="file" >

    </form>

    <form action="#" method="post">
        <label for="name">name</label>
        <input type="text" id="name" name="name" minlength="3" maxlength="20" value="abc" autofocus > 
        <label for="email">email</label>
        <input type="email" name="email" id="email" required>
        <button type="submit">login</button>
        <textarea name="message" id="message" rows="5" cols="30" placeholder="Write your message..."></textarea>
    </form> 

    <select name="country" id="country" multiple>
    <option value="">Select country</option>
    <option value="us">United States</option>
    <option value="sy">syria</option>
    <option value="ca">Canada</option>
</select>

<input list="languages" name="language">
<datalist id="languages">
    <option value="HTML">
    <option value="CSS">
    <option value="JavaScript">
    <option value="Python">
    <option value="Java">
</datalist>

</body>
</html>
